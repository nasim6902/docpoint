spring.application.name=user-service
server.port=8082

spring.datasource.url=jdbc:mysql://localhost:3306/docpoint_user_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:Abdul@sql123}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#JWT configuration
jwt.secret=${JWT_SECRET:the-sercret-key-for-jwt---fhfhhfhhfhhfhhfh}

# Eureka Client Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# Register User-Service with eureka
eureka.client.register-with-eureka=true
eureka.instance.prefer-ip-address=true

#fetch service registry
eureka.client.fetch-registry=true
